<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    BWI-RHA Admin Dashboard | Ado LG
</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   ADMIN
========================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f8f4;
    color: #222;
}

.hidden {
    display: none !important;
}

.admin-wrapper {
    min-height: 100vh;
}


/* LOGIN */

.login-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-card {
    background: white;
    width: 100%;
    max-width: 430px;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.1);
}

.login-logo {
    width: 70px;
    height: 70px;
    background: #087f3f;
    color: white;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 24px;
    margin-bottom: 20px;
}

.login-card h1 {
    color: #087f3f;
    margin-bottom: 5px;
}

.login-card p {
    color: #666;
}


/* INPUTS */

.admin-input,
.admin-select {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 9px;

    margin-top: 7px;

    margin-bottom: 15px;

    background: white;

    font-size: 15px;

}

label {
    font-weight: bold;
}


/* BUTTONS */

.admin-button {

    border: none;

    border-radius: 8px;

    padding: 10px 15px;

    cursor: pointer;

    font-weight: bold;

}

.admin-button:hover {
    opacity: .85;
}

.primary {
    background: #087f3f;
    color: white;
}

.danger {
    background: #c62828;
    color: white;
}

.warning {
    background: #e6a700;
    color: white;
}

.secondary {
    background: #e8eee9;
    color: #087f3f;
}


/* HEADER */

.dashboard-header {

    background: #087f3f;

    color: white;

    padding: 20px;

}

.dashboard-header-inner {

    max-width: 1250px;

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.dashboard-header h1 {
    margin: 0;
}

.dashboard-header p {
    margin: 5px 0 0;
}


/* CONTENT */

.dashboard-content {

    max-width: 1250px;

    margin: auto;

    padding: 25px 15px;

}


/* STATS */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 25px;

}

.stat {

    background: white;

    border-radius: 14px;

    padding: 20px;

    text-align: center;

    box-shadow:
        0 5px 20px rgba(0,0,0,.05);

}

.stat strong {

    display: block;

    font-size: 30px;

    color: #087f3f;

}


/* TABS */

.tabs {

    display: flex;

    gap: 8px;

    margin-bottom: 20px;

    flex-wrap: wrap;

}

.tab {

    background: white;

    border: 1px solid #ddd;

    color: #087f3f;

}

.tab.active {

    background: #087f3f;

    color: white;

}


/* CARDS */

.admin-card {

    background: white;

    border-radius: 15px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.05);

}

.admin-card h2 {

    margin-top: 0;

    color: #087f3f;

}

.table
