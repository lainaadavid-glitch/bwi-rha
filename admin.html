<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        BWI-RHA Admin | Ado LG
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =================================================
           ADMIN PAGE
        ================================================= */

        .admin-page {
            min-height: 100vh;
            padding: 40px 20px;
            background: #f4faf5;
        }

        .admin-container {
            max-width: 1200px;
            margin: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-title h1 {
            margin: 0;
            color: #087a35;
        }

        .admin-title p {
            margin-top: 6px;
            color: #666;
        }

        .admin-button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout-button {
            background: #d62828;
            color: white;
        }

        .refresh-button {
            background: #087a35;
            color: white;
        }

        /* =================================================
           LOGIN
        ================================================= */

        .login-box {
            max-width: 450px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .login-box h1 {
            text-align: center;
            color: #087a35;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-form-group {
            margin-bottom: 18px;
        }

        .login-form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .login-form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            border: none;
            padding: 14px;
            background: #087a35;
            color: white;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
        }

        .login-button:hover {
            background: #065d29;
        }

        #loginMessage {
            margin-top: 15px;
            text-align: center;
        }

        /* =================================================
           DASHBOARD
        ================================================= */

        #dashboard {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .stat-card span {
            color: #666;
            font-size: 14px;
        }

        .stat-card strong {
            display: block;
            font-size: 32px;
            margin-top: 8px;
            color: #087a35;
        }

        /* =================================================
           MEMBERS
        ================================================= */

        .members-section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .members-section h2 {
            margin-top: 0;
            color: #087a35;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .members-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        .members-table th,
        .members-table td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .members-table th {
            background: #087a35;
            color: white;
        }

        .members-table tr:hover {
            background: #f7fbf8;
        }

        /* =================================================
           STATUS
        ================================================= */

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-rejected {
            background: #f8d7da;
            color: #842029;
        }

        /* =================================================
           ACTION BUTTONS
        ================================================= */

        .action-button {
            border: none;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            margin: 2px;
        }

        .approve-button {
            background: #087a35;
            color: white;
        }

        .reject-button {
            background: #f0ad4e;
            color: white;
        }

        .delete-button {
            background: #d62828;
            color: white;
        }

        .action-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* =================================================
           MESSAGE
        ================================================= */

        .admin-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .admin-message.success {
            display: block;
            background: #d1e7dd;
            color: #0f5132;
        }

        .admin-message.error {
            display: block;
            background: #f8d7da;
            color: #842029;
        }

        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .admin-page {
                padding: 20px 12px;
            }

            .login-box {
                margin: 30px auto;
                padding: 25px;
            }

            .members-section {
                padding: 15px;
            }

        }

    </style>
</head>


<body>

<div class="admin-page">

    <div class="admin-container">


        <!-- =================================================
             LOGIN
        ================================================= -->

        <div id="loginSection">

            <div class="login-box">

                <h1>
                    🟢 BWI-RHA
                </h1>

                <p>
                    ADO LG ADMIN LOGIN
                </p>


                <form id="loginForm">

                    <div class="login-form-group">

                        <label for="adminEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="adminEmail"
                            placeholder="Admin email"
                            required
                        >

                    </div>


                    <div class="login-form-group">

                        <label for="adminPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >
                        Login
                    </button>


                    <div
                        id="loginMessage"
                    ></div>

                </form>

            </div>

        </div>


        <!-- =================================================
             DASHBOARD
        ================================================= -->

        <div id="dashboard">

            <div class="admin-header">

                <div class="admin-title">

                    <h1>
                        BWI-RHA ADMIN DASHBOARD
                    </h1>

                    <p>
                        EKITI STATE CHAPTER — ADO LG
                    </p>

                </div>


                <div>

                    <button
                        class="admin-button refresh-button"
                        id="refreshButton"
                    >
                        🔄 Refresh
                    </button>

                    <button
                        class="admin-button logout-button"
                        id="logoutButton"
                    >
                        Logout
                    </button>

                </div>

            </div>


            <div
                id="adminMessage"
                class="admin-message"
            ></div>


            <!-- STATS -->

            <div class="stats-grid">

                <div class="stat-card">

                    <span>
                        Total Members
                    </span>

                    <strong id="totalMembers">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Pending
                    </span>

                    <strong id="pendingMembers">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Approved
                    </span>

                    <strong id="approvedMembers">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Rejected
                    </span>

                    <strong id="rejectedMembers">
                        0
                    </strong>

                </div>

            </div>


            <!-- MEMBERS -->

            <section class="members-section">

                <h2>
                    Member Registrations
                </h2>

                <div class="table-wrapper">

                    <table class="members-table">

                        <thead>

                            <tr>

                                <th>
                                    Name
                                </th>

                                <th>
                                    Phone
                                </th>

                                <th>
                                    Bank
                                </th>

                                <th>
                                    Account No.
                                </th>

                                <th>
                                    Ward
                                </th>

                                <th>
                                    Address
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="membersTableBody">

                            <tr>

                                <td
                                    colspan="8"
                                    style="text-align:center;"
                                >
                                    Loading...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </div>

</div>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* =====================================================
       SUPABASE CONFIG
    ===================================================== */

    const SUPABASE_URL =
        "https://xfjrmgendmmpnumsbjte.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_qBhmzkK4DDeZk1_pheHgRA_rNKHDKS7";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =====================================================
       WARDS
    ===================================================== */

    const wards = {

        1: "Ado A — Idofin",
        2: "Ado B — Inisa",
        3: "Ado C — Idolofin",
        4: "Ado D — Ijigbo",
        5: "Ado E — Ijoka / Orereowu",
        6: "Ado F — Okeyinmi",
        7: "Ado G — Oke Ila",
        8: "Ado H — Ereguru",
        9: "Ado I — Dallimore",
        10: "Ado J — Okesa",
        11: "Ado K — Irona",
        12: "Ado L — Igbehin",
        13: "Ado M — Farm Settlement"

    };


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginSection =
        document.getElementById(
            "loginSection"
        );

    const dashboard =
        document.getElementById(
            "dashboard"
        );

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const loginMessage =
        document.getElementById(
            "loginMessage"
        );

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );

    const membersTableBody =
        document.getElementById(
            "membersTableBody"
        );

    const adminMessage =
        document.getElementById(
            "adminMessage"
        );


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById(
                        "adminEmail"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "adminPassword"
                    )
                    .value;


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            loginMessage.textContent = "";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(error);

                loginMessage.textContent =
                    error.message;

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;
            }


            console.log(
                "Admin logged in:",
                data.user
            );


            loginSection.style.display =
                "none";

            dashboard.style.display =
                "block";


            await loadMembers();

        }
    );


    /* =====================================================
       CHECK EXISTING LOGIN
    ===================================================== */

    async function checkLogin() {

        const {
            data
        } =
            await supabaseClient.auth.getSession();


        if (
            data &&
            data.session
        ) {

            loginSection.style.display =
                "none";

            dashboard.style.display =
                "block";

            await loadMembers();

        }

    }


    /* =====================================================
       LOAD MEMBERS
    ===================================================== */

    async function loadMembers() {

        membersTableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="text-align:center;"
                >
                    Loading members...
                </td>

            </tr>

        `;


        const {
            data: members,
            error
        } =
            await supabaseClient
                .from("members")
                .select(`
                    id,
                    full_name,
                    phone,
                    bank_name,
                    account_number,
                    ward_id,
                    address,
                    status
                `)
                .order(
                    "id",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(error);

            membersTableBody.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        style="text-align:center;"
                    >
                        Unable to load members:
                        ${escapeHTML(
                            error.message
                        )}
                    </td>

                </tr>

            `;

            return;
        }


        updateStatistics(
            members || []
        );


        if (
            !members ||
            members.length === 0
        ) {

            membersTableBody.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        style="text-align:center;"
                    >
                        No registrations yet.
                    </td>

                </tr>

            `;

            return;
        }


        membersTableBody.innerHTML =
            members
                .map(
                    member =>
                        createMemberRow(
                            member
                        )
                )
                .join("");

    }


    /* =====================================================
       CREATE MEMBER ROW
    ===================================================== */

    function createMemberRow(member) {

        const statusClass =
            member.status === "approved"
                ? "status-approved"
                : member.status === "rejected"
                    ? "status-rejected"
                    : "status-pending";


        return `

            <tr>

                <td>
                    ${escapeHTML(
                        member.full_name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        member.phone
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        member.bank_name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        member.account_number
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        wards[member.ward_id]
                        || "Unknown ward"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        member.address
                    )}
                </td>

                <td>

                    <span
                        class="status ${statusClass}"
                    >
                        ${escapeHTML(
                            member.status
                        )}
                    </span>

                </td>

                <td>

                    ${
                        member.status !== "approved"
                        ? `
                            <button
                                class="action-button approve-button"
                                onclick="approveMember(${member.id})"
                            >
                                ✓ Approve
                            </button>
                        `
                        : ""
                    }


                    ${
                        member.status !== "rejected"
                        ? `
                            <button
                                class="action-button reject-button"
                                onclick="rejectMember(${member.id})"
                            >
                                ✕ Reject
                            </button>
                        `
                        : ""
                    }


                    <button
                        class="action-button delete-button"
                        onclick="deleteMember(${member.id})"
                    >
                        🗑 Delete
                    </button>

                </td>

            </tr>

        `;

    }


    /* =====================================================
       APPROVE MEMBER
    ===================================================== */

    async function approveMember(id) {

        if (
            !confirm(
                "Approve this member?"
            )
        ) {
            return;
        }


        const {
            error
        } =
            await supabaseClient
                .from("members")
                .update({
                    status: "approved"
                })
                .eq(
                    "id",
                    id
                );


        if (error) {

            showAdminMessage(
                error.message,
                "error"
            );

            return;
        }


        showAdminMessage(
            "Member approved successfully.",
            "success"
        );


        await loadMembers();

    }


    /* =====================================================
       REJECT MEMBER
    ===================================================== */

    async function rejectMember(id) {

        if (
            !confirm(
                "Reject this member?"
            )
        ) {
            return;
        }


        const {
            error
        } =
            await supabaseClient
                .from("members")
                .update({
                    status: "rejected"
                })
                .eq(
                    "id",
                    id
                );


        if (error) {

            showAdminMessage(
                error.message,
                "error"
            );

            return;
        }


        showAdminMessage(
            "Member rejected.",
            "success"
        );


        await loadMembers();

    }


    /* =====================================================
       DELETE MEMBER
    ===================================================== */

    async function deleteMember(id) {

        if (
            !confirm(
                "Delete this member permanently?"
            )
        ) {
            return;
        }


        const {
            error
        } =
            await supabaseClient
                .from("members")
                .delete()
                .eq(
                    "id",
                    id
                );


        if (error) {

            showAdminMessage(
                error.message,
                "error"
            );

            return;
        }


        showAdminMessage(
            "Member deleted.",
            "success"
        );


        await loadMembers();

    }


    /* =====================================================
       STATISTICS
    ===================================================== */

    function updateStatistics(
        members
    ) {

        const total =
            members.length;


        const pending =
            members.filter(
                member =>
                    member.status ===
                    "pending"
            ).length;


        const approved =
            members.filter(
                member =>
                    member.status ===
                    "approved"
            ).length;


        const rejected =
            members.filter(
                member =>
                    member.status ===
                    "rejected"
            ).length;


        document.getElementById(
            "totalMembers"
        ).textContent = total;


        document.getElementById(
            "pendingMembers"
        ).textContent = pending;


        document.getElementById(
            "approvedMembers"
        ).textContent = approved;


        document.getElementById(
            "rejectedMembers"
        ).textContent = rejected;

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    logoutButton.addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            dashboard.style.display =
                "none";

            loginSection.style.display =
                "block";

        }
    );


    /* =====================================================
       REFRESH
    ===================================================== */

    refreshButton.addEventListener(
        "click",
        async function() {

            await loadMembers();

        }
    );


    /* =====================================================
       ADMIN MESSAGE
    ===================================================== */

    function showAdminMessage(
        message,
        type
    ) {

        adminMessage.textContent =
            message;

        adminMessage.className =
            "admin-message " +
            type;


        setTimeout(
            () => {

                adminMessage.className =
                    "admin-message";

            },
            4000
        );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       START
    ===================================================== */

    checkLogin();

</script>

</body>
</html>
