<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BWI-RHA Ado LG Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f7f3;
    color: #222;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.12);
}

.logo {
    width: 70px;
    height: 70px;
    background: #087f3f;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
}

.login-box h1 {
    color: #087f3f;
    margin-bottom: 5px;
}

.login-box p {
    color: #666;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 7px;
    margin-bottom: 18px;
    font-size: 15px;
}

label {
    font-weight: bold;
}

button {
    cursor: pointer;
}

.login-btn,
.primary {
    background: #087f3f;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 12px 18px;
    font-weight: bold;
}

.login-btn {
    width: 100%;
}

.error {
    background: #ffdede;
    color: #a00000;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
}

.success {
    background: #d9f5df;
    color: #087f3f;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}


/* DASHBOARD */

#dashboard {
    min-height: 100vh;
}

.header {
    background: #087f3f;
    color: white;
    padding: 20px;
}

.header-inner {
    max-width: 1300px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
}

.header p {
    margin: 5px 0 0;
}

.logout {
    background: white;
    color: #087f3f;
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: bold;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 25px 15px;
}


/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
}

.stat-number {
    display: block;
    font-size: 30px;
    color: #087f3f;
    font-weight: bold;
}


/* TABS */

.tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.tab {
    padding: 11px 18px;
    border: 1px solid #087f3f;
    background: white;
    color: #087f3f;
    border-radius: 8px;
    font-weight: bold;
}

.tab.active {
    background: #087f3f;
    color: white;
}


/* CARDS */

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
}

.card h2 {
    color: #087f3f;
}


/* TABLE */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #087f3f;
    color: white;
}

.action {
    border: 0;
    border-radius: 6px;
    padding: 7px 10px;
    margin: 2px;
    font-weight: bold;
}

.approve {
    background: #087f3f;
    color: white;
}

.reject {
    background: #e5a000;
    color: white;
}

.delete {
    background: #c62828;
    color: white;
}

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status.pending {
    background: #fff0bd;
}

.status.approved {
    background: #d5f3dc;
}

.status.rejected {
    background: #ffdada;
}


/* EXCO */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.exco-item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.position {
    color: #087f3f;
    font-weight: bold;
}

.remove {
    background: #c62828;
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 8px 12px;
}


/* MOBILE */

@media(max-width:800px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }
}

@media(max-width:500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .exco-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
}
</style>
</head>

<body>

     LOGIN PAGE
===================================================== -->

            </button>

        </form>
