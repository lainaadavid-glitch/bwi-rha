<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BWI-RHA Admin | Ado LG</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-page {
            min-height: 100vh;
            background: #f4f8f5;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: auto;
        }

        .admin-header {
            background: #087f3f;
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin: 0 0 5px;
        }

        .admin-header p {
            margin: 0;
        }

        .login-card,
        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            margin-bottom: 25px;
        }

        .login-card {
            max-width: 500px;
            margin: 60px auto;
        }

        .admin-card h2 {
            color: #087f3f;
            margin-top: 0;
        }

        .admin-input {
            width: 100%;
            padding: 13px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .admin-button {
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 3px;
        }

        .login-button,
        .approve-button {
            background: #087f3f;
            color: white;
        }

        .reject-button {
            background: #e6a700;
            color: white;
        }

        .delete-button {
            background: #c62828;
            color: white;
        }

        .logout-button {
            background: white;
            color: #087f3f;
            float: right;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        .stat strong {
            display: block;
            font-size: 30px;
            color: #087f3f;
        }

        .member-table-wrapper {
            overflow-x: auto;
        }

        .member-table {
            width: 100%;
            border-collapse: collapse;
        }

        .member-table th,
        .member-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .member-table th {
            background: #087f3f;
            color: white;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .message {
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .admin-page {
                padding: 20px 10px;
            }
        }
    </style>
</head>

<body>

<div class="admin-page">

    <div class="admin-container">

        <!-- LOGIN -->

        <div id="loginSection" class="login-card">

            <h1>🟢 BWI-RHA Admin</h1>

            <p>
                BWI-RHA Ekiti State Chapter — Ado LG
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="adminEmail"
                    class="admin-input"
                    placeholder="Admin email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    class="admin-input"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    class="admin-button login-button"
                    style="width:100%;"
                >
                    Login
                </button>

            </form>

            <div id="loginMessage" class="message"></div>

        </div>


        <!-- DASHBOARD -->

        <div id="dashboard" class="hidden">

            <div class="admin-header">

                <button
                    id="logoutButton"
                    class="admin-button logout-button"
                >
                    Logout
                </button>

                <h1>
                    BWI-RHA Admin Dashboard
                </h1>

                <p>
                    Ekiti State Chapter — Ado LG
                </p>

            </div>


            <!-- STATISTICS -->

            <div class="stats">

                <div class="stat">
                    <strong id="totalCount">0</strong>
                    Total Members
                </div>

                <div class="stat">
                    <strong id="pendingCount">0</strong>
                    Pending
                </div>

                <div class="stat">
                    <strong id="approvedCount">0</strong>
                    Approved
                </div>

                <div class="stat">
                    <strong id="rejectedCount">0</strong>
                    Rejected
                </div>

            </div>


            <!-- MEMBERS -->

            <div class="admin-card">

                <h2>Member Registrations</h2>

                <div id="adminMessage" class="message"></div>

                <div class="member-table-wrapper">

                    <table class="member-table">

                        <thead>

                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Bank</th>
                                <th>Account</th>
                                <th>Ward</th>
                                <th>Address</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="membersTable">

                            <tr>
                                <td colspan="8">
                                    Loading...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>
